<div class="login-page">

  <!-- blobs decorativos -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-shell">

    <!-- lado esquerdo: branding -->
    <aside class="branding">
      <div class="brand-logo">
        <img src="images/logo/logo-final.png" alt="Logo" />
      </div>
    </aside>

    <!-- lado direito: formulário -->
    <section class="login-card">

      <div class="card-top">
        <h1 class="titulo">Bem-vindo de volta</h1>
        <p class="subtitulo">Entre com seu email e senha para continuar.</p>
      </div>

      <form class="form-area" (ngSubmit)="entrar()">
        <div class="campo">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="email"
              type="email"
              placeholder="seu@email.com"
              [(ngModel)]="dto.email"
              name="email"
              [class.input-erro]="erro"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="senha"
              [type]="senhaVisivel ? 'text' : 'password'"
              placeholder="••••••••"
              [(ngModel)]="dto.senha"
              name="senha"
              [class.input-erro]="erro"
              autocomplete="current-password"
            />
            <button class="btn-toggle-senha" type="button" (click)="toggleSenha()">
              <svg *ngIf="!senhaVisivel" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="senhaVisivel" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        @if (erro) {
          <div class="alerta-erro">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ erro }}
          </div>
        }

        <button
          class="btn-entrar"
          type="submit"
          [disabled]="carregando || !dto.email || !dto.senha"
        >
          @if (carregando) {
            <span class="spinner"></span>
          } @else {
            <span>Entrar</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          }
        </button>
      </form>

      <p class="rodape-card">© 2026 · Todos os direitos reservados</p>
    </section>

  </div>

</div>
